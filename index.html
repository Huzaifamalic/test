<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Signup</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js" defer></script>
    <!-- SweetAlert2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to right, #4a00e0, #00d4ff);
            font-family: Arial, sans-serif;
        }
        .container {
            width: 350px;
            padding: 50px;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        .form-box h2 {
            margin-bottom: 20px;
            color: #2c3e50;
        }
        .input-group {
            margin: 10px 0;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #dfe6e9;
            border-radius: 5px;
            background: #f8f9fa;
        }
        .input-group input:focus {
            outline: none;
            border-color: #8e2de2;
        }
        .btn {
            width: 100%;
            padding: 10px;
            background: #8e2de2;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn:hover {
            background: #00d4ff;
        }
        .toggle-text {
            margin-top: 10px;
            font-size: 14px;
            color: #636e72;
        }
        .toggle-text a {
            color: #8e2de2;
            text-decoration: none;
            font-weight: bold;
        }
        .toggle-text a:hover {
            color: #00d4ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-box">
            <h2 id="form-title">Login</h2>
            <form id="auth-form">
                <div class="input-group">
                    <input type="email" id="email" placeholder="Email" required>
                </div>
                <div class="input-group">
                    <input type="password" id="password" placeholder="Password" required>
                </div>
                <button type="submit" class="btn">Login</button>
                <p class="toggle-text">Create account? Sign Up <a href="#" id="toggle-form">Sign Up</a></p>
            </form>
        </div>
    </div>
    <script type="module">
        // Import Firebase SDKs
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-auth.js";
        
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCYRmfnq_JnrcdxhP4xrWMu5mMdb6fQjAo",
            authDomain: "islam-app-6bb2e.firebaseapp.com",
            projectId: "islam-app-6bb2e",
            storageBucket: "islam-app-6bb2e.firebasestorage.app",
            messagingSenderId: "74748834935",
            appId: "1:74748834935:web:0bd586c92ad0fa6c540272",
            measurementId: "G-L7ZDP3NWBE"
        };
        
        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        
        document.addEventListener("DOMContentLoaded", () => {
            const toggleForm = document.getElementById('toggle-form');
            const formTitle = document.getElementById('form-title');
            const submitButton = document.querySelector('.btn');
            const authForm = document.getElementById('auth-form');
            
            toggleForm.addEventListener('click', (e) => {
                e.preventDefault();
                if (formTitle.innerText === "Login") {
                    formTitle.innerText = "Sign Up";
                    submitButton.innerText = "Sign Up";
                    toggleForm.innerText = "Already have an account? Login";
                } else {
                    formTitle.innerText = "Login";
                    submitButton.innerText = "Login";
                    toggleForm.innerText = "Create account? Sign Up";
                }
            });

            authForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                
                if (formTitle.innerText === "Sign Up") {
                    createUserWithEmailAndPassword(auth, email, password)
                        .then(() => {
                            Swal.fire({
                                icon: 'success',
                                title: 'Success!',
                                text: 'Sign Up successful! Please login.',
                                confirmButtonColor: '#8e2de2',
                            }).then(() => {
                                formTitle.innerText = "Login";
                                submitButton.innerText = "Login";
                                toggleForm.innerText = "Don't have an account? Sign Up";
                            });
                        })
                        .catch(error => {
                            Swal.fire({
                                icon: 'error',
                                title: 'Oops...',
                                text: error.message,
                                confirmButtonColor: '#8e2de2',
                            });
                        });
                } else {
                    signInWithEmailAndPassword(auth, email, password)
                        .then(() => {
                            Swal.fire({
                                icon: 'success',
                                title: 'Welcome!',
                                text: 'Login successful! Redirecting to attendance page...',
                                confirmButtonColor: '#8e2de2',
                                timer: 1500,
                                timerProgressBar: true,
                            }).then(() => {
                                window.location.href = "./attendance.html";
                            });
                        })
                        .catch(error => {
                            Swal.fire({
                                icon: 'error',
                                title: 'Oops...',
                                text: error.message,
                                confirmButtonColor: '#8e2de2',
                            });
                        });
                }
            });
        });
    </script>
</body>
</html>
